# Builds Audioble into a sideloadable (unsigned) IPA and publishes it as a
# GitHub Release, together with a SideStore/AltStore source feed so the build
# can be installed and updated from inside the sideloader.
#
# Pushing to the default branch releases as build-N; pushing a v* tag releases
# under that tag.
#
# One job on purpose: no simulator, no screenshot capture, no test target -
# checkout to published release is a few minutes.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even when the app did not change"
        type: boolean
        default: false

permissions:
  contents: write
  # Read-only, purely to ask whether Pages is serving; see the feed step.
  pages: read

env:
  # Generated files follow the ref being built; a tag build writes to the
  # default branch, since a tag is not a place to commit to.
  TARGET_BRANCH: >-
    ${{ github.ref_type == 'tag'
        && github.event.repository.default_branch
        || github.ref_name }}

concurrency:
  # A newer build supersedes whatever is still running on the same ref, since
  # those race to commit the feed to one branch. The ref is used fully
  # qualified so a branch and a tag of the same name stay apart.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          # Newest Xcode on the image, so the app is built against the newest
          # iOS SDK the runner has.
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          sw_vers
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          TARGET=$(sed -n 's/.*IPHONEOS_DEPLOYMENT_TARGET = \([0-9.]*\);.*/\1/p' \
            Audioble.xcodeproj/project.pbxproj | head -1)
          echo "iOS SDK: $SDK, deployment target: $TARGET"
          # A deployment target above the installed SDK fails deep inside the
          # build with an opaque message; say what is actually wrong here.
          if [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | head -1)" != "$TARGET" ]; then
            echo "::error::Deployment target $TARGET is newer than the installed iOS SDK $SDK."
            echo "::error::Lower IPHONEOS_DEPLOYMENT_TARGET in Audioble.xcodeproj, or wait for a runner image with a newer Xcode."
            exit 1
          fi

      - name: Has the app changed since the last release?
        id: appcheck
        run: |
          set -euo pipefail
          # Only what ends up inside the IPA. A README or feed edit deliberately
          # does not force a rebuild.
          STAMP=$( {
            git rev-parse HEAD:Audioble
            git rev-parse HEAD:Audioble.xcodeproj
            git hash-object .github/scripts/build_app.sh .github/scripts/package_ipa.sh
          } | shasum -a 256 | cut -d' ' -f1 )
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Building: tag push or forced."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f .build-stamp ] && [ "$(cat .build-stamp)" = "$STAMP" ]; then
            echo "App unchanged since the last release; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "App changed; building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        if: steps.appcheck.outputs.skip != 'true'
        id: version
        run: |
          set -euo pipefail
          PLIST=Audioble/Resources/Info.plist
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          # Monotonic third component so SideStore can tell builds apart and
          # offer updates. Stamped into the checkout only - the committed plist
          # is left untouched.
          VERSION="${BASE}.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build
        if: steps.appcheck.outputs.skip != 'true'
        run: |
          set -o pipefail
          .github/scripts/build_app.sh Release iphoneos 2>&1 | tee build.log

      - name: Package the IPA
        if: steps.appcheck.outputs.skip != 'true'
        id: package
        run: |
          set -euo pipefail
          .github/scripts/package_ipa.sh build/Release-iphoneos/Audioble.app Audioble.ipa
          echo "size=$(stat -f%z Audioble.ipa)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 Audioble.ipa | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "human_size=$(ls -lh Audioble.ipa | awk '{print $5}')" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        if: steps.appcheck.outputs.skip != 'true'
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=Audioble ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=Audioble build #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA as run artifact (non-fatal, short retention)
        if: steps.appcheck.outputs.skip != 'true'
        # The account-wide artifact quota must never kill a finished build - the
        # GitHub Release below is the real distribution channel.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Audioble-ipa
          path: Audioble.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build the SideStore source feed
        if: steps.appcheck.outputs.skip != 'true'
        id: feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIZE: ${{ steps.package.outputs.size }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The one-tap "Add to SideStore" button needs the Pages landing page.
          # It must not be advertised before Pages actually serves, so ask - and
          # on any doubt fall back to raw.githubusercontent.com, which needs
          # nothing switched on.
          PAGES_URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null || true)
          # With Pages off, gh prints its 404 body to stdout and that lands in
          # PAGES_URL. Anything that is not a URL means "no Pages".
          case "$PAGES_URL" in
            http://*|https://*) ;;
            *) PAGES_URL="" ;;
          esac
          export PAGES_URL
          echo "Pages: ${PAGES_URL:-not enabled}"
          python3 .github/scripts/make_icon.py icon.png 512
          python3 .github/scripts/make_source.py .

      - name: Publish the release
        if: steps.appcheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.tag.outputs.title }}
          VERSION: ${{ steps.version.outputs.version }}
          IPA_SIZE: ${{ steps.package.outputs.human_size }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          SOURCE_URL: ${{ steps.feed.outputs.source_url }}
          PAGES_URL: ${{ steps.feed.outputs.pages_url }}
        run: |
          set -euo pipefail
          # GitHub strips sidestore:// links from release bodies, so the one-tap
          # button only exists once Pages is serving the landing page.
          if [ -n "${PAGES_URL:-}" ]; then
            ADD_SOURCE="**[Zu SideStore hinzufügen](${PAGES_URL%/}/)**"
          else
            ADD_SOURCE="Diese Quelle in SideStore hinzufügen: \`$SOURCE_URL\`"
          fi

          {
            printf '## Audioble %s\n\n' "$VERSION"
            printf 'Lokaler Hörbuch-Player: ZIP importieren, hören, Position wird gemerkt.\n\n'
            printf '### Installieren\n\n'
            printf '%s\n\n' "$ADD_SOURCE"
            printf 'Oder `Audioble.ipa` laden und mit SideStore, AltStore oder Sideloadly installieren.\n\n'
            printf '### Enthalten\n\n'
            printf -- '- Bibliothek mit Suche, Filtern, Raster- und Listenansicht\n'
            printf -- '- ZIP-Import mit Kapiteln, ID3-Titeln und Cover\n'
            printf -- '- Autoplay ins nächste Kapitel, gespeicherte Hörposition\n'
            printf -- '- 30-Sekunden-Sprünge, Tempo, Schlummer-Timer, Clips, Auto-Modus\n'
            printf -- '- Sperrbildschirm, Control Center und AirPlay\n\n'
            printf '### Build\n\n'
            printf -- '- IPA: %s · SHA-256 `%s`\n' "$IPA_SIZE" "$SHA256"
            printf -- '- Unsigniert; Sideloader signieren beim Installieren neu.\n'
          } > notes.md
          cat notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" Audioble.ipa --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" Audioble.ipa --repo "${{ github.repository }}" \
              --title "$TITLE" --notes-file notes.md
          fi

      - name: Commit the source feed
        if: steps.appcheck.outputs.skip != 'true'
        # Committed rather than deployed with actions/deploy-pages: the Actions
        # token may not create the Pages site itself. This makes the feed
        # reachable over raw.githubusercontent.com immediately, and over Pages
        # as soon as Pages is switched on for the branch. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # The stamp rides along with the feed: both describe the release that
          # was just published.
          echo "${{ steps.appcheck.outputs.stamp }}" > .build-stamp
          .github/scripts/commit_generated.sh \
            "Update source feed for ${{ steps.tag.outputs.tag }}" \
            s.json apps.json icon.png index.html .build-stamp

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
